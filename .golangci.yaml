version: "2"
linters:
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - err113
    - gocognit
    - goconst
    - gosec
    - misspell
    - promlinter
    - staticcheck
    - unconvert
    - whitespace
    - wsl
  settings:
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
